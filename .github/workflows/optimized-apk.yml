name: Optimized Android APKs under 50 MB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/optimized-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimized-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Recreate bundled model assets
        run: python3 scripts/export_quantized_models.py
      - name: Run existing unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble optimized signed ABI-specific release beta APKs
        run: gradle --no-daemon :app:assembleRelease -PtakzAbiSplits=true -PtakzBetaSigning=true --stacktrace
      - name: Inspect APK sizes and signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -name '*.apk' -type f | sort)
          if [ "${#apks[@]}" -ne 4 ]; then
            echo "::error::Expected four ABI-specific APKs, found ${#apks[@]}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            bytes=$(stat -c%s "$apk")
            echo "$apk — $bytes bytes"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            if [ "$bytes" -ge 50000000 ]; then
              echo "::error::$apk exceeds 50,000,000 bytes"
              exit 1
            fi
          done
      - name: Upload optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: takz-optimized-signed-per-abi
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
